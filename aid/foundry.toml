[profile.default]
src = "src"
test = "test"
out = "out"
libs = []
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200

# No dependencies. The Solidity test deliberately avoids forge-std so that the one check
# which must be reproducible - two independent implementations agreeing on the vectors -
# has no network-fetched supply chain underneath it.
#
# `test/` also holds JavaScript tests; Foundry only picks up *.sol there, and the JavaScript
# runner only picks up *.test.mjs, so the two coexist without configuration.