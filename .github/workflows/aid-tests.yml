name: Phase 4/5 — AID conformance, registry and deterministic deployment

# Two independent implementations of the same specification:
#   aid/src/aid.mjs  — JavaScript reference
#   aid/src/Aid.sol  — Solidity
# They assert the SAME vectors. A specification enforced by one codebase asserting its own
# correctness is not a specification.
#
# The registry and factory tests target the three ways CREATE2 and a claim registry are
# usually got wrong, each of which fails silently rather than loudly.
#
# The vanity tool's output is verified against Foundry's own CREATE2 implementation. A search
# tool that computes addresses with its own code and then congratulates itself has verified
# nothing.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/aid-tests.yml"
      - "aid/**"

permissions:
  contents: read

concurrency:
  group: aid-tests
  cancel-in-progress: true

jobs:
  aid:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout NEXORA
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Foundry (forge, cast)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      # One pinned dependency: the keccak-256 primitive. A cryptographic permutation is not
      # something to improvise, and an earlier hand-written implementation was silently
      # wrong. The known-answer tests are what actually guarantee the hash is correct.
      - name: Install pinned dependencies
        working-directory: aid
        run: npm install --no-audit --no-fund --loglevel=error

      # `node --test test/` fails on Node 22 with "Cannot find module .../aid/test";
      # the glob is explicit for the same reason.
      - name: JavaScript unit, property and fuzz tests
        working-directory: aid
        run: node --test test/*.test.mjs

      # The cross-check that matters: an independent Solidity implementation must agree
      # with the JavaScript reference on every vector, and the registry/factory contracts
      # must behave as their own headers claim.
      - name: Solidity implementation, registry and factory tests
        working-directory: aid
        run: forge test -vv

      - name: Emit canonical test vectors
        working-directory: aid
        run: |
          set -eu
          node test/emit-vectors.mjs
          echo
          echo "--- vectors.json ---"
          cat vectors.json

      # A vanity search that computes CREATE2 addresses with its own arithmetic has proved
      # nothing on its own. `cast compute-address` is Foundry's implementation; the two must
      # agree, or the search is measuring the wrong function.
      #
      # The Solidity test `test_predictMatchesTheDeployedAddress` separately proves that
      # AidFactory.predict equals what the EVM's CREATE2 actually produces. Together those
      # two checks tie this script to the EVM without either of them trusting the other.
      - name: Verify the search against an independent implementation
        working-directory: aid
        run: |
          set -eu
          DEPLOYER=0x00000000000000000000000000000000c0ffee12
          # keccak256 of the bytes "nexora-aid-vanity-probe"; any fixed 32-byte value works.
          INIT_HASH=$(cast keccak 0x6e65786f72612d6169642d76616e6974792d70726f6265)
          echo "deployer     = $DEPLOYER"
          echo "initCodeHash = $INIT_HASH"

          if ! OUT=$(node scripts/vanity.mjs \
              --deployer "$DEPLOYER" \
              --init-code-hash "$INIT_HASH" \
              --pattern 0000 \
              --max-attempts 2000000); then
            echo "$OUT"
            echo "::error::the search found no address within the stated ceiling; this is a real negative result"
            exit 1
          fi
          echo "$OUT"

          JSON=$(printf '%s\n' "$OUT" | tail -1)
          SALT=$(printf '%s' "$JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["salt"])')
          MINE=$(printf '%s' "$JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["address"])')
          THEIRS=$(cast compute-address --salt "$SALT" --init-code-hash "$INIT_HASH" "$DEPLOYER")
          THEIRS=$(printf '%s' "$THEIRS" | tr 'A-Z' 'a-z')

          echo ""
          echo "vanity.mjs  : $MINE"
          echo "cast        : $THEIRS"
          if [ "$MINE" != "$THEIRS" ]; then
            echo "::error::independent implementations disagree on the CREATE2 address"
            exit 1
          fi
          echo "OK: two independent implementations agree on the CREATE2 address"

      - name: Verify no credential material in aid/
        working-directory: aid
        run: |
          set -eu
          if grep -rInE 'gh[pousr]_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|BEGIN [A-Z ]*PRIVATE KEY' \
               --exclude-dir=node_modules --exclude-dir=out --exclude-dir=cache . 2>/dev/null; then
            echo "FAIL: credential-shaped material found"
            exit 1
          fi
          echo "OK: no credential-shaped strings in aid/"

      - name: Upload vectors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aid-vectors
          path: aid/vectors.json
