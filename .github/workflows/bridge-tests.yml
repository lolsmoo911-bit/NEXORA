name: Bridge — OpenCode MCP bridge tests

# Verifies the bridge protocol, its safety properties and a real bidirectional round trip
# against a fake OpenCode API. Runs on every change under bridge/.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/bridge-tests.yml"
      - "bridge/**"
      - "docs/bridge-runbook.md"

permissions:
  contents: read

concurrency:
  group: bridge-tests
  cancel-in-progress: true

jobs:
  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: bridge
    steps:
      - name: Checkout NEXORA
        uses: actions/checkout@v4
        with:
          # history is needed so the diff/log tools have something real to read
          fetch-depth: 50

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: "Levels 1-3: unit + MCP HTTP conformance + OpenCode contract tests"
        run: npm test

      - name: "Configuration self-check (no secrets printed)"
        run: node src/index.mjs --check

      - name: "Level 3: end-to-end bidirectional round trip against a fake OpenCode API"
        run: node test/smoke-stdio.mjs

      - name: "Level 4: real OpenCode server compatibility"
        env:
          PROBE_BASE_URL: ${{ vars.OPENCODE_BASE_URL }}
          PROBE_PASSWORD: ${{ secrets.OPENCODE_SERVER_PASSWORD }}
        run: |
          set -eu
          if [ -z "${PROBE_BASE_URL}" ]; then
            echo "NOT RUN (documented limit): no real OpenCode server is configured for CI."
            echo "Level 4 requires a host running 'opencode serve'. See docs/bridge-runbook.md section 'Evidence levels'."
            exit 0
          fi
          PROBE_BASE_URL="$PROBE_BASE_URL" PROBE_PASSWORD="$PROBE_PASSWORD" \
            node test/opencode-real-probe.mjs

      - name: Verify the repo contains no credential material
        run: |
          set -eu
          echo "scanning bridge/ and docs/ for secret-shaped strings..."
          if grep -rInE 'gh[pousr]_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|BEGIN [A-Z ]*PRIVATE KEY' \
               src test ../docs/bridge-runbook.md 2>/dev/null; then
            echo "FAIL: credential-shaped material found"
            exit 1
          fi
          echo "OK: no credential-shaped strings in the bridge"
