name: Agent coordination — task inbox watcher

# Coordination transport for the OpenCode <-> reviewer loop.
#
# WHAT THIS ACTUALLY IS (and is not):
#   - GitHub Actions is the only component in this environment that runs
#     continuously without a human. This workflow is therefore the inbound
#     transport: it watches the coordination issue for newly posted tasks and,
#     for each one, opens a dedicated `agent-task` run so that execution work is
#     recorded, auditable and idempotent on GitHub.
#   - It CANNOT invoke an OpenCode session. There is no MCP server, no always-on
#     host, and no reachable OpenCode HTTP API in this environment. That limit is
#     documented in docs/agent-coordination.md, not worked around by pretending.
#
# Secrets: none. This workflow never needs a token because the automatic
# GITHUB_TOKEN is used, which is repository-scoped and least-privilege.

on:
  schedule:
    # every 15 minutes (GitHub cron is UTC). Cheap: the job exits in seconds.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number to scan (default 1)"
        required: false
        default: "1"

permissions:
  contents: read
  issues: read
  # required solely to dispatch the per-task agent-task workflow
  actions: write

concurrency:
  group: agent-coordination-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Scan coordination issue for new tasks
        id: scan
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = Number('${{ inputs.issue || 1 }}');
            const marker = '<!-- nexora-task -->';
            const state = {
              seen: [],
              tasks: []
            };

            // Durable cursor: the last comment id we processed is stored in the
            // repository variable-less artifact below via the run summary; for
            // discovery we simply look at all comments and skip ones already
            // represented by an `agent-task` run.
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100
            });

            const runRes = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'agent-task.yml',
              per_page: 100
            });
            // github-script hands back { data, status, url }; the payload is in .data
            const runData = runRes && runRes.data;
            const runs = Array.isArray(runData) ? runData : (runData && runData.workflow_runs) || [];
            // idempotency key: the dispatch title embeds "task title (comment <id>)"
            const alreadyDispatched = new Set(
              runs.filter(r => r.event === 'workflow_dispatch').map(r => r.display_title || '')
            );

            for (const c of comments) {
              if (!c.body || c.body.indexOf(marker) < 0) continue;
              const title = (c.body.match(/^#\s*(.+)$/m) || [])[1] || 'untitled task';
              // the dispatch title embeds the comment id so a later scan can detect it
              const dispatchTitle = title + ' (comment ' + c.id + ')';
              if (alreadyDispatched.has(dispatchTitle)) {
                state.seen.push({ id: c.id, title, status: 'already-dispatched' });
                continue;
              }
              state.seen.push({ id: c.id, title, status: 'new' });
              state.tasks.push({ comment_id: c.id, title, dispatch_title: dispatchTitle });
            }

            core.summary
              .addHeading('Agent coordination watcher')
              .addRaw(`issue: #${issue_number}\n`)
              .addRaw(`marker comments seen: ${state.seen.length}\n`)
              .addRaw(`new tasks awaiting dispatch: ${state.tasks.length}\n`)
              .write();
            core.setOutput('count', String(state.tasks.length));
            core.setOutput('json', JSON.stringify(state.tasks));

      - name: Dispatch one idempotent run per new task
        if: steps.scan.outputs.count != '0'
        uses: actions/github-script@v7
        env:
          TASKS: ${{ steps.scan.outputs.json }}
        with:
          script: |
            const tasks = JSON.parse(process.env.TASKS);
            for (const t of tasks) {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'agent-task.yml',
                ref: 'main',
                inputs: {
                  // the display_title of a dispatch run becomes "<title> (comment <id>)"
                  title: t.dispatch_title,
                  comment_id: String(t.comment_id)
                }
              });
              core.info(`dispatched agent-task for comment ${t.comment_id}: ${t.title}`);
            }
