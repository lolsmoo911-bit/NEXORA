name: Agent coordination — task inbox watcher

# Coordination transport for the OpenCode <-> reviewer loop.
#
# WHAT THIS ACTUALLY IS (and is not):
#   - GitHub Actions is the only component in this environment that runs
#     continuously without a human. This workflow is therefore the inbound
#     transport: it watches the coordination issue for newly posted tasks and,
#     for each one, dispatches a dedicated `agent-task` run so that execution
#     work is recorded, auditable and idempotent on GitHub.
#   - It CANNOT invoke an OpenCode session. There is no MCP server, no always-on
#     host, and no reachable OpenCode HTTP API in this environment. That limit is
#     documented in docs/agent-coordination.md, not worked around by pretending.
#
# Idempotency: after dispatching a task, the watcher replies to the coordination
# issue with a hidden marker comment `<!-- nexora-dispatched:<id> -->`. A later
# scan skips any task comment whose id already has such a marker. This is durable
# (stored in the issue) and needs no external state.
#
# Secrets: none. This workflow never needs a personal token; it uses the
# repository-scoped automatic GITHUB_TOKEN with least-privilege permissions.

on:
  schedule:
    # every 15 minutes (GitHub cron is UTC). Cheap: the job exits in seconds.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number to scan (default 1)"
        required: false
        default: "1"

permissions:
  contents: read
  issues: write       # read task comments + post dispatch markers
  actions: write      # dispatch the per-task agent-task workflow

concurrency:
  group: agent-coordination-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Scan coordination issue for new tasks
        id: scan
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = Number('${{ inputs.issue || 1 }}');
            const TASK_MARKER = '<!-- nexora-task -->';
            const DISPATCH_RE = /<!-- nexora-dispatched:(\d+) -->/g;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100
            });

            // comments already dispatched, from the durable marker replies
            const dispatched = new Set();
            for (const c of comments) {
              if (!c.body) continue;
              for (const m of c.body.matchAll(DISPATCH_RE)) dispatched.add(m[1]);
            }

            const tasks = [];
            for (const c of comments) {
              if (!c.body || c.body.indexOf(TASK_MARKER) < 0) continue;
              if (dispatched.has(String(c.id))) continue;
              const title = (c.body.match(/^#\s*(.+)$/m) || [])[1] || 'untitled task';
              tasks.push({ comment_id: c.id, title });
            }

            core.summary
              .addHeading('Agent coordination watcher')
              .addRaw(`issue: #${issue_number}\n`)
              .addRaw(`task comments total: ${comments.filter(c => c.body && c.body.indexOf(TASK_MARKER) >= 0).length}\n`)
              .addRaw(`already dispatched: ${dispatched.size}\n`)
              .addRaw(`new tasks awaiting dispatch: ${tasks.length}\n`)
              .write();
            core.setOutput('count', String(tasks.length));
            core.setOutput('json', JSON.stringify(tasks));

      - name: Dispatch one idempotent run per new task
        if: steps.scan.outputs.count != '0'
        uses: actions/github-script@v7
        env:
          TASKS: ${{ steps.scan.outputs.json }}
          ISSUE: ${{ inputs.issue || 1 }}
        with:
          script: |
            const tasks = JSON.parse(process.env.TASKS);
            const issue_number = Number(process.env.ISSUE);
            for (const t of tasks) {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'agent-task.yml',
                ref: 'main',
                inputs: {
                  title: t.title,
                  comment_id: String(t.comment_id)
                }
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body: `<!-- nexora-dispatched:${t.comment_id} -->`
                  + `\nDispatched \`agent-task\` for comment ${t.comment_id}: **${t.title}**`
                  + `\n\n<sub>Posted automatically by \`agent-coordination-watcher\`. `
                  + `This marker makes the dispatch idempotent.</sub>`
              });
              core.info(`dispatched agent-task for comment ${t.comment_id}: ${t.title}`);
            }
